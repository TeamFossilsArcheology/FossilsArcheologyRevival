import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id "com.github.johnrengelman.shadow"
    id "com.modrinth.minotaur"
    id "net.darkhax.curseforgegradle"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-$parchment_mc_version:$parchment_date@zip")
    }

    //Required
    modImplementation "net.fabricmc:fabric-loader:$fabric_loader_version"
    modApi "net.fabricmc.fabric-api:fabric-api:$fabric_api_version+$minecraft_version"
    modApi "dev.architectury:architectury-fabric:$architectury_version"
    modApi include("teamreborn:energy:$energy_version")
    modImplementation include("maven.modrinth:sructurized-reborn:1.19.3-01")//Structurized Reborneborn
    modImplementation "software.bernie.geckolib:geckolib-fabric-$minecraft_version:$gecko_lib_version"
    implementation "com.eliotlash.mclib:mclib:20"
    modImplementation "com.github.glitchfiend:TerraBlender-fabric:$minecraft_version-$terra_blender_version"
    modImplementation include("dev.onyxstudios.cardinal-components-api:cardinal-components-base:$cardinal_components_version")
    modImplementation include("dev.onyxstudios.cardinal-components-api:cardinal-components-entity:$cardinal_components_version")
    modImplementation include("maven.modrinth:midnightlib:$midnight_lib_version")
    modImplementation "com.github.darkpred.morehitboxes:morehitboxes-fabric-$minecraft_version:$more_hitboxes_version"

    //Optional
    modCompileOnly "maven.modrinth:jade:$jade_version_fabric"
    modRuntimeOnly "maven.modrinth:jade:$jade_version_fabric"
    modImplementation "me.shedaniel:RoughlyEnoughItems-fabric:$rei_version"
    modCompileOnly "maven.modrinth:carry-on:$carry_on_version_fabric"
    //modCompileOnly "maven.modrinth:farmers-delight-fabric:$farmers_delight_version_fabric"

    //FD addons
    //modCompileOnly "maven.modrinth:oceans-delight:fdrf-fabric-1.0.2-1.20"
    //modCompileOnly "curse.maven:nethers-delight-fabric-701831:4353098" //1.19.2 1.0.1
    //modCompileOnly "maven.modrinth:biomesyougo:1.19.3-3.0.1.1-fabric"
    //modCompileOnly "maven.modrinth:ends-delight:VQxr0ozB" //1.19.2-2.0
    //modCompileOnly "maven.modrinth:cultural-delights-fabric:1.0.5+1.20.1"
    //modCompileOnly "maven.modrinth:pineapple-delight:x85UwMri" //1.20.1-1.0.13
    //modCompileOnly "maven.modrinth:festive-delight:Gs9jmquQ" //1.20.1-1.1.0
    //modCompileOnly "maven.modrinth:coffee-delight:IOftAwJN" //1.19.3 1.4
    //modCompileOnly "maven.modrinth:casualness-delight:1.20.1-0.4-FDR"
    //modCompileOnly "maven.modrinth:seed-delight:2MhNzl7f" //1.20.1-1.0.1
    //modCompileOnly "maven.modrinth:brewin-and-chewin-fabric:3.0.6+1.20.1"
    //modCompileOnly "curse.maven:farmers-respite-fabric-811003:4658852" //1.19.2-2.2.5
    //modCompileOnly "curse.maven:expanded-delight-620770:4409058" //1.19.3 0.2.5.2

    //Dev only
    /*
    modRuntimeOnly("maven.modrinth:auth-me:4.2.0")
    modRuntimeOnly "maven.modrinth:huge-structure-blocks:1.0.6"
    //modRuntimeOnly "curse.maven:worldedit-225608:3697298"
    modRuntimeOnly "curse.maven:cyanide-543444:4481357"
    modRuntimeOnly "maven.modrinth:smoothboot-fabric:1.19-1.7.1"
    modRuntimeOnly "curse.maven:commandstructures-565119:4050783"
    modRuntimeOnly "maven.modrinth:betterf3:4.0.1"
    modRuntimeOnly "maven.modrinth:lazydfu:0.1.3"
    //modRuntimeOnly "maven.modrinth:sodium:mc1.19.2-0.4.4"
    //modRuntimeOnly "maven.modrinth:indium:1.0.9+mc1.19.2
    //runtimeOnly "org.joml:joml:1.10.4"
    modRuntimeOnly "maven.modrinth:modmenu:4.2.0-beta.2"
    modRuntimeOnly "maven.modrinth:camera-utils:fabric-1.19.2-1.0.14"
    //modRuntimeOnly "maven.modrinth:replaymod:1.19.2-2.6.20"
    //modRuntimeOnly "maven.modrinth:energized-power:1.19.2-2.12.4-fabric")/Energized Power
    //modRuntimeOnly "maven.modrinth:debugutils:1.19.4-1.0.3"
    //modRuntimeOnly "com.github.darkpred.extended_structure_blocks:extended-structure-blocks-fabric:${minecraftVersion}-0.4.0"
    */
    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}
shadowJar {
    exclude "architectury.common.json"
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    injectAccessWidener = true
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    //TODO: Needed? archiveAppendix = "fabric-$minecraft_version"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

modrinth {
    token = "${project.property("MODRINTH_TOKEN") ?: "no value"}"
    projectId = "IJY7IqPP"
    versionNumber = "$minecraft_version-$mod_version-${project.name}"
    versionType = "release"
    uploadFile = tasks.remapJar
    versionName = "$mod_version for Fabric $minecraft_version"
    debugMode = true
    dependencies {
        required.project("fabric-api")
        required.project("architectury-api")
        required.project("geckolib")
        required.project("terrablender")
        required.project("more-hitboxes")
        embedded.project("cardinal-components-api")
        embedded.project("sructurized-reborn")
        embedded.project("midnightlib")
    }
    changelog = rootProject.file("CHANGELOG.md").text
}

tasks.register('publishCurseForge', TaskPublishCurseForge) {
    group = "publishing"
    description = "Publishes jar to CurseForge"
    apiToken = project.property("CURSEFORGE_TOKEN") ?: "no value"
    debugMode = true
    def mainFile = upload(223908, tasks.remapJar)
    mainFile.addEnvironment("Fabric")
    mainFile.displayName = "$mod_version for Fabric $minecraft_version"
    mainFile.changelog = rootProject.file("CHANGELOG.md").text
    mainFile.changelogType = "markdown"
    mainFile.releaseType = "release"
    mainFile.addRequirement("fabric-api", "architectury-api", "geckolib", "terrablender-fabric", "more-hitboxes")
    mainFile.addEmbedded("cardinal-components-api", "midnightlib")
}

tasks.named("publish") {
    finalizedBy("modrinth", "publishCurseForge")
}
