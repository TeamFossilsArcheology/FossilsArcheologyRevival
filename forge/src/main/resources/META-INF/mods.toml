modLoader = "javafml"
loaderVersion = "[${forge_loader_version_range},)"

license = "${mod_license}"
issueTrackerURL = "https://github.com/TeamFossilsArcheology/FossilsArcheologyRevival/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/fossils"

logoFile = "fossils.png"
credits = "Original mod by Flammarilva and Team July!"
authors = "${forge_mod_authors}"
description = "${mod_description}"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "[${forge_version_range},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
